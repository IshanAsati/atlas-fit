<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#131019" />
  <circle cx="256" cy="256" r="210" fill="#1b1623" stroke="#3d3549" stroke-width="4" />
  <!-- Stylized Atlas character / strength emblem -->
  <g transform="translate(256, 256) scale(1.1)">
    <!-- Aura / accent circle -->
    <circle cx="0" cy="-20" r="110" fill="none" stroke="#ba83f7" stroke-width="6" opacity="0.4" stroke-dasharray="16 8" />
    <!-- Shoulders & Arms -->
    <path d="M-80,40 C-80,-10 -60,-40 -20,-60 L20,-60 C60,-40 80,-10 80,40 C60,45 40,30 25,20 L-25,20 C-40,30 -60,45 -80,40 Z" fill="#27222f" stroke="#57b9fa" stroke-width="8" stroke-linejoin="round" />
    <!-- Chest / Torso -->
    <path d="M-45,-10 L45,-10 L30,65 L-30,65 Z" fill="#322b3d" stroke="#3d3549" stroke-width="4" />
    <!-- Pectorals highlight -->
    <path d="M-38,-2 L-4,-2 L-4,30 L-32,25 Z" fill="#f04455" opacity="0.9" />
    <path d="M38,-2 L4,-2 L4,30 L32,25 Z" fill="#f04455" opacity="0.9" />
    <!-- Core / abs -->
    <rect x="-18" y="36" width="16" height="12" rx="3" fill="#a675eb" opacity="0.8" />
    <rect x="2" y="36" width="16" height="12" rx="3" fill="#a675eb" opacity="0.8" />
    <!-- Head / Neck -->
    <rect x="-14" y="-85" width="28" height="30" rx="8" fill="#322b3d" stroke="#3d3549" stroke-width="4" />
    <circle cx="0" cy="-105" r="32" fill="#dad7e8" stroke="#3d3549" stroke-width="6" />
    <!-- Dumbbell bar overhead / athletic crown -->
    <path d="M-110,-120 L110,-120" stroke="#57b9fa" stroke-width="12" stroke-linecap="round" />
    <rect x="-125" y="-140" width="16" height="40" rx="6" fill="#ba83f7" />
    <rect x="-145" y="-132" width="14" height="24" rx="4" fill="#57b9fa" />
    <rect x="109" y="-140" width="16" height="40" rx="6" fill="#ba83f7" />
    <rect x="131" y="-132" width="14" height="24" rx="4" fill="#57b9fa" />
  </g>
</svg>
